services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: talon
      POSTGRES_PASSWORD: talon
      POSTGRES_DB: talon
    ports:
      - '5432:5432'
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talon -d talon']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
    ports:
      - '4566:4566'
