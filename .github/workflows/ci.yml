name: ci
on:
  push:
    branches: [main, 'demo/**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # if: always() is demo-branch-only — every gate reports its own verdict so
      # all three boundary violations are visible in one run (spec 001 §4.5).
      - run: pnpm build
      - run: pnpm lint
        if: always()
      - run: pnpm typecheck
        if: always()
      - run: pnpm test
        if: always()
      - run: pnpm test:routes
        if: always()
