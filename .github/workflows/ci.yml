name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mirrors the postgres service in docker-compose.yml. No init script is mounted
    # (service containers cannot mount repo files anyway): the db suite bootstraps
    # everything it needs — talon_test via setup.global.ts, the talon_app role via
    # ensureAppRole(), citext/pg_trgm via 0001_init.up.sql.
    #
    # Do NOT drop the port mapping in favour of DATABASE_URL=postgres://…@postgres:5432
    # (nor move the job into `container:`). resolveAppRolePassword in migrate.ts only
    # hands out the dev app-role password over a loopback host; a `postgres` hostname
    # fails it with an Aurora/credentials error that reads as nonsense in a CI log.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talon
          POSTGRES_PASSWORD: talon
          POSTGRES_DB: talon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U talon -d talon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait radicale
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          RUN_RADICALE: '1'
      - run: pnpm test:isolation
      - run: pnpm test:routes
      # The contrast check lands with the token pipeline's own gate — spec 001 §10.
      # e2e is the job below: it needs a browser and a Cognito pool, so it does not
      # belong in the job every PR waits on.

  # ---------------------------------------------------------------------------
  # e2e — spec 001 §10's vertical slice, against the real API.
  #
  # Separate job, not more steps above: it installs a browser and talks to AWS,
  # and neither belongs in the fast gate. It runs in parallel with `ci`.
  #
  # WHY THE `if`. `LocalIdentityProvider` was deleted by the Cognito-only
  # refactor, so the api refuses to boot without a reachable user pool — this
  # suite cannot run on configuration alone. Until the three repository settings
  # below exist the job is skipped, and it must NOT be marked a required check
  # while that is true: a required check that never runs is a green tick that
  # means nothing. CLAUDE.md §8 — wire the gate, or write down when it lands.
  #
  # Repository → Settings → Secrets and variables → Actions:
  #   vars.AWS_E2E_ROLE_ARN      role this job assumes via OIDC (see below)
  #   vars.COGNITO_USER_POOL_ID  identifier, not a secret
  #   vars.COGNITO_CLIENT_ID     identifier, not a secret
  #   vars.COGNITO_REGION        optional, defaults to us-east-1
  #   secrets.TALON_JWT_SECRET   the only real secret in the set; the api refuses
  #                              to boot on the published local constant
  #
  # THE ROLE DOES NOT EXIST YET (infra stream). Neither existing role fits:
  # `github_plan` is read-only and cannot provision a pool user, and
  # `github_deploy` can run `terraform apply` — far too much for a test job, and
  # unassumable from a PR anyway, since its trust policy pins the default branch.
  # What this needs is a third, narrow role trusted on `pull_request` +
  # the default branch, allowing only these, on only the dev pool's ARN:
  #
  #   cognito-idp:AdminCreateUser      (seed:identities, re-runnable)
  #   cognito-idp:AdminSetUserPassword
  #   cognito-idp:AdminGetUser
  #   cognito-idp:AdminInitiateAuth    (sign-in)
  #
  # Static keys work too — drop `role-to-assume` and set AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY as secrets — but OIDC is preferred because there is no
  # long-lived credential to leak or rotate.
  # ---------------------------------------------------------------------------
  e2e:
    if: vars.AWS_E2E_ROLE_ARN != '' && vars.COGNITO_USER_POOL_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write # OIDC. Without it configure-aws-credentials cannot mint a token.
      contents: read
    # Serialised across branches, and deliberately NOT cancel-in-progress.
    #
    # The database is this job's own service container, but the Cognito pool is
    # shared, and sign-in throttling (429, added in f41ac45) is a pool-wide
    # resource. Two runs signing in at once can throttle each other into a
    # failure that has nothing to do with either change. Queueing costs latency;
    # a flaky shared-pool gate costs trust in the gate.
    concurrency:
      group: e2e-cognito-pool
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talon
          POSTGRES_PASSWORD: talon
          POSTGRES_DB: talon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U talon -d talon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_REGION: ${{ vars.COGNITO_REGION || 'us-east-1' }}
      TALON_JWT_SECRET: ${{ secrets.TALON_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ vars.COGNITO_REGION || 'us-east-1' }}
          role-session-name: talon-e2e-${{ github.run_id }}

      # The api has no dev script; Playwright starts `node dist/server.js`, so the
      # build is a prerequisite rather than a convenience.
      - run: pnpm build

      # Chromium only — the suite declares one project. `--with-deps` installs the
      # system libraries the runner image does not carry.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - run: pnpm db:migrate

      # `db:seed` chains `seed:identities`, which is the half that writes
      # users.external_id. Without it Cognito authenticates the password and the
      # api still answers user_not_provisioned — see e2e/global-setup.ts.
      - run: pnpm db:seed

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
